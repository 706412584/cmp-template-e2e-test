name: Build Multiplatform

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyComposeMultiplatform-android-debug
          path: app/build/outputs/apk/debug/*.apk

  desktop-jar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
        if: matrix.os != 'windows-latest'
      - run: ./gradlew :desktop:packageUberJarForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: MyComposeMultiplatform-desktop-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/main/**/*.jar
            desktop/build/compose/jars/*.jar

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: MyComposeMultiplatform-web
          path: composeApp/build/dist/wasmJs/productionExecutable/**
